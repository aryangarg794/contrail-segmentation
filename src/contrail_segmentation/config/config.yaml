# conf/config.yaml
# Top-level Hydra config.  Override any value from the CLI:
#   uv run train model=baseline_unet data.batch_size=8 trainer.max_epochs=500

defaults:
  - model: baseline_unet
  - _self_

hydra:
  job:
    chdir: false

seed: 42

data:
  batch_size:  16
  num_workers: 4

trainer:
  max_epochs:        1000
  accelerator:       auto
  devices:           1
  patience:          100
  log_every_n_steps: 10